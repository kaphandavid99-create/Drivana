<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" fill="none" stroke="white" stroke-width="2.5">
  <!-- Toyota Logo - Three overlapping ovals forming T -->
  <!-- Outer large oval -->
  <ellipse cx="50" cy="38" rx="42" ry="28" fill="none" stroke="white" stroke-width="3"/>
  <!-- Horizontal bar of T (top thin oval) -->
  <ellipse cx="50" cy="22" rx="28" ry="10" fill="none" stroke="white" stroke-width="2"/>
  <!-- Vertical stem of T (overlaps horizontal) -->
  <ellipse cx="50" cy="32" rx="10" ry="22" fill="none" stroke="white" stroke-width="2"/>
</svg>
